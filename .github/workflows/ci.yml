name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore TurboBoard.sln --locked-mode

      - name: Build
        run: dotnet build TurboBoard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TurboBoard.sln --configuration Release --no-build --no-restore
